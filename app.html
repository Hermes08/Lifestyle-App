<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Panama Lifestyle OS · Concierge</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #050609;
      font-family: 'Manrope', system-ui, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    .stage {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%,   #1a1c30 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 80%,   #0c1a12 0%, transparent 60%),
        #050609;
    }

    #phone-frame {
      position: absolute; top: 0; left: 0;
      transform-origin: 0px 0px;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0.7; }
      to   { transform: translateX(0);    opacity: 1;   }
    }
    @keyframes slideInLeft {
      from { transform: translateX(-55%); opacity: 0.5; }
      to   { transform: translateX(0);    opacity: 1;   }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1);    }
    }

    .slide-forward { animation: slideInRight 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .slide-back    { animation: slideInLeft  0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .fade-in       { animation: fadeIn       0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  </style>

  <script>
    (function () {
      var DW = 402, DH = 874;
      function resizePhone() {
        var el = document.getElementById('phone-frame');
        if (!el) return;
        var vw = window.innerWidth, vh = window.innerHeight, PAD = 40;
        var s = Math.min(1, (vh - PAD) / DH, (vw - PAD) / DW);
        var scaledW = DW * s, scaledH = DH * s;
        el.style.transform = [
          'translate(' + Math.round((vw - scaledW) / 2) + 'px,',
                         Math.round((vh - scaledH) / 2) + 'px)',
          'scale(' + s + ')'
        ].join(' ');
      }
      window.addEventListener('resize', resizePhone);
      window._resizePhone = resizePhone;
      var _tries = 0;
      (function tryScale() {
        resizePhone();
        if (!document.getElementById('phone-frame') && ++_tries < 40)
          setTimeout(tryScale, 100);
      })();
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script src="concierge/tones.js?v=2"></script>
  <script src="concierge/webgl-exploring.js?v=3"></script>
  <script src="concierge/app-state.js?v=2"></script>
  <script type="text/babel" src="concierge/ios-frame.jsx?v=2" data-presets="react"></script>
  <script type="text/babel" src="concierge/screens.jsx?v=3" data-presets="react"></script>
</head>
<body>
  <div class="stage">
    <div id="root"></div>
  </div>

  <script type="text/babel" data-presets="react">
    const AppCtx = React.createContext(null);
    window.AppCtx = AppCtx;

    function AppRouter() {
      const [st, setSt] = React.useState(() =>
        (window.AppState && window.AppState.getState)
          ? window.AppState.getState()
          : { screen: 'welcome', stage: 'exploring', transition: 'none' }
      );

      React.useEffect(() => {
        return window.AppState.subscribe(function (s) {
          setSt(Object.assign({}, s));
        });
      }, []);

      React.useEffect(() => {
        if (window._resizePhone) window._resizePhone();
      }, []);

      const { ScreenWelcome, ScreenStagePicker, ScreenDesk, ScreenChat, ScreenPricing, ScreenAccount } =
        window.ConciergeScreens;
      const tones = window.CONCIERGE_TONES;
      const tone  = Object.assign({}, tones[st.stage], { id: st.stage });

      const SCREENS = {
        welcome:  ScreenWelcome,
        picker:   ScreenStagePicker,
        desk:     ScreenDesk,
        chat:     ScreenChat,
        pricing:  ScreenPricing,
        account:  ScreenAccount,
      };
      const ActiveScreen = SCREENS[st.screen] || ScreenWelcome;

      const animClass = st.screen === 'welcome'
        ? 'fade-in'
        : st.transition === 'back'
          ? 'slide-back'
          : 'slide-forward';

      const ctxValue = {
        state:           st,
        navigate:        window.AppState.navigate,
        goBack:          window.AppState.goBack,
        selectStage:     window.AppState.selectStage,
        confirmStage:    window.AppState.confirmStage,
        setMode:         window.AppState.setMode,
        addPoints:       window.AppState.addPoints,
        openChat:        window.AppState.openChat,
        seedChat:        window.AppState.seedChat,
        sendMessage:     window.AppState.sendMessage,
        selectTier:      window.AppState.selectTier,
        isAgeRestricted: window.AppState.isAgeRestricted,
        newChat:         window.AppState.newChat,
      };

      return (
        <window.AppCtx.Provider value={ctxValue}>
          <div id="phone-frame">
            <window.IOSDevice dark width={402} height={874}>
              <div style={{ position: 'relative', height: '100%', overflow: 'hidden' }}>
                <div
                  key={st.screen}
                  className={animClass}
                  style={{ position: 'absolute', inset: 0, willChange: 'transform, opacity' }}
                >
                  <ActiveScreen tone={tone} />
                </div>
              </div>
            </window.IOSDevice>
          </div>
        </window.AppCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AppRouter />);
  </script>
</body>
</html>
